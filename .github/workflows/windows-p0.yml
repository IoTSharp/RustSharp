name: Windows x64 P0 evidence

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-p0:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10.0.400
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Install rustc 1.98 oracle
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Restore
        run: dotnet restore RustSharp.slnx
      - name: Build
        run: dotnet build RustSharp.slnx -c Release --no-restore
      - name: Run executable harness
        run: dotnet run --project tests/RustSharp.Tests/RustSharp.Tests.csproj -c Release --no-build --no-restore
      - name: Restore IL verifier
        run: dotnet tool restore --tool-manifest .config/dotnet-tools.json
      - name: Compile vertical sample
        run: dotnet run --project src/RustSharp.Cli -c Release --no-build --no-restore -- compile samples/hello.rs --output artifacts/p0/hello.dll
      - name: Verify IL
        run: pwsh -NoProfile -File eng/Invoke-ILVerify.ps1 -AssemblyPath artifacts/p0/hello.dll -EvidencePath artifacts/p0/hello.ilverify.json
      - name: Run conformance harness
        continue-on-error: true
        run: dotnet run --project tools/RustSharp.Conformance -c Release --no-build --no-restore -- --profile vertical-slice-v1 --oracle rustc-1.98
      - name: Run I/O smoke probes
        continue-on-error: true
        run: dotnet run --project tools/RustSharp.Smoke -c Release --no-build --no-restore -- --profile p0-io
      - name: Upload P0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-p0-evidence
          path: artifacts
          if-no-files-found: warn
